[package]
name = "voxfigura-desktop"
version = "0.2.1"
description = "VoxFigura Portable Desktop Launcher (Tauri 2)"
authors = ["VoxFigura"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
