<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-style="neumorphism" data-bg="aurora">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/app-icon.png" />
  <title>VoxFigura · 语音实验与声乐编曲</title>
  <script type="importmap">
    {
      "imports": {
        "three": "/vocal-tract/vendor/three.module.js"
      }
    }
  </script>
  <style>
    @font-face {
      font-family: "PTBIPAPlus";
      src: url("/fonts/PTBIPAPlus-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Doulos SIL";
      src: url("/fonts/DoulosSIL-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    /* Zero-flash initial boot card (handed off seamlessly to StartupSplash.vue) */
    #vc-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 22% 18%, rgba(221, 205, 255, 0.36), transparent 52%),
        radial-gradient(circle at 80% 82%, rgba(20, 116, 82, 0.11), transparent 48%),
        #f4f3f9;
      font-family: "Noto Serif SC", "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
    }
    #vc-boot-splash .vc-boot-card {
      width: min(620px, calc(100vw - 36px));
      min-height: 312px;
      padding: 32px 36px 26px;
      border-radius: 17px;
      background: linear-gradient(180deg, #fcfbff 0%, #f7f4fc 100%);
      border: 1px solid #dfd7ee;
      box-shadow:
        0 26px 64px -18px rgba(42, 27, 74, 0.18),
        0 4px 16px rgba(42, 27, 74, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      user-select: none;
    }
    #vc-boot-splash .vc-boot-head {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    #vc-boot-splash .vc-boot-icon {
      width: 72px;
      height: 72px;
      border-radius: 17px;
      flex: none;
      box-shadow: 0 6px 18px -6px rgba(57, 37, 94, 0.25);
    }
    #vc-boot-splash .vc-boot-title {
      margin: 0;
      font-family: "Times New Roman", Georgia, serif;
      font-size: 33px;
      font-weight: 600;
      line-height: 1.12;
      color: #271b44;
    }
    #vc-boot-splash .vc-boot-sub {
      margin: 5px 0 0;
      font-size: 15px;
      color: #5f5678;
    }
    #vc-boot-splash .vc-boot-rule {
      height: 1px;
      margin: 22px 0;
      background: linear-gradient(90deg, #dfd7ee 0%, rgba(223, 215, 238, 0.16) 100%);
    }
    #vc-boot-splash .vc-boot-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    #vc-boot-splash .vc-boot-stage {
      font-size: 20px;
      font-weight: 500;
      color: #2a1f47;
    }
    #vc-boot-splash .vc-boot-pct {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 31px;
      color: #4b3186;
    }
    #vc-boot-splash .vc-boot-body {
      margin: 10px 0 22px;
      font-size: 14.5px;
      color: #665d80;
    }
    #vc-boot-splash .vc-boot-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #eae3f6;
      overflow: hidden;
    }
    #vc-boot-splash .vc-boot-fill {
      width: 12%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #9d82dc 0%, #4b3186 100%);
    }
    #vc-boot-splash .vc-boot-foot {
      margin-top: auto;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      color: #776f8f;
    }
    #vc-boot-splash .vc-boot-steps {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 15px;
    }
    html[data-theme="dark"] #vc-boot-splash {
      background:
        radial-gradient(circle at 22% 18%, rgba(124, 92, 206, 0.24), transparent 52%),
        radial-gradient(circle at 82% 84%, rgba(29, 127, 122, 0.16), transparent 48%),
        #0d0c14;
    }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-card {
      background: linear-gradient(180deg, #1d1a2a 0%, #171522 100%);
      border-color: #342d4c;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.58),
        0 4px 16px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-title { color: #f1edf9; }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-sub { color: #aba2c4; }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-rule {
      background: linear-gradient(90deg, #3a3254 0%, rgba(58, 50, 84, 0.12) 100%);
    }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-stage { color: #ebe6f7; }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-pct { color: #b79ff2; }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-body { color: #9e95b8; }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-track { background: #28233a; }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-fill {
      background: linear-gradient(90deg, #7c5fd1 0%, #c1acfa 100%);
    }
    html[data-theme="dark"] #vc-boot-splash .vc-boot-foot { color: #8c84a6; }
  </style>
  <script>
    (function () {
      try {
        var mode = '';
        var raw = localStorage.getItem('vc.appearance.v1');
        if (raw) {
          var cfg = JSON.parse(raw);
          if (cfg && (cfg.themeMode === 'light' || cfg.themeMode === 'dark')) {
            mode = cfg.themeMode;
          } else if (cfg && cfg.themeMode === 'system' && window.matchMedia) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        }
        if (!mode) {
          var h = new Date().getHours();
          mode = h >= 6 && h < 19 ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = mode;
      } catch (e) {
        var hour = new Date().getHours();
        document.documentElement.dataset.theme = hour >= 6 && hour < 19 ? 'light' : 'dark';
      }
    })();
  </script>
</head>
<body>
  <div id="vc-boot-splash" role="status" aria-live="polite" aria-label="正在启动 VoxFigura">
    <div class="vc-boot-card">
      <div class="vc-boot-head">
        <img class="vc-boot-icon" src="/app-icon.png" width="72" height="72" alt="" />
        <div>
          <h1 class="vc-boot-title">VoxFigura</h1>
          <p class="vc-boot-sub">物理声道驱动的语音实验与声乐编曲平台</p>
        </div>
      </div>
      <div class="vc-boot-rule"></div>
      <div class="vc-boot-row">
        <div class="vc-boot-stage">正在启动 VoxFigura</div>
        <div class="vc-boot-pct">0%</div>
      </div>
      <p class="vc-boot-body">正在检查运行文件并加载界面，请耐心等待。</p>
      <div class="vc-boot-track"><div class="vc-boot-fill"></div></div>
      <div class="vc-boot-foot">
        <span>主界面就绪后自动关闭此提示</span>
        <span class="vc-boot-steps">1 / 3</span>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
