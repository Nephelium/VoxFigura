[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m27-tract-studio"
version = "0.1.0"
description = "Packable M27 dynamic vocal-tract & glottal trajectory reconstruction studio with speech denoiser and themeable web UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "torch>=2.1",
    "transformers>=4.40",
    "onnxruntime>=1.16",
]

[project.scripts]
m27-tract-studio-serve = "m27_tract_studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/m27_tract_studio/web" = [
    "web/index.html",
    "web/theme.css",
    "web/tract-studio.css",
    "web/tract-renderer.js",
    "web/tract-studio.js",
]
